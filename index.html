<!DOCTYPE html>
<html lang="pt-BR"><head><base target="_top"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Credenciamento · AGLP</title>
<style>
/* Credenciamento: tela de balcão (celular). Lista com busca, etiqueta com QR de contato, cadastro na hora. */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --ink:#14222E; --mute:#5E6E7C; --line:#D9DFE5; --soft:#F5F7F9;
  --accent:#1B5FAA; --accent-ink:#FFFFFF; --accent-soft:#E3EEF9;
  --good:#1F7A4C; --good-bg:#DFF3E7; --warn:#A85A06; --warn-bg:#FCEBD2; --bad:#B02F2F; --bad-bg:#F9DEDE; --mute-bg:#E8ECF0;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--font);padding-bottom:40px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding:0 12px}
.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 12px}
.top .in{max-width:760px;margin:0 auto}
.row{display:flex;align-items:center;gap:10px}
.evn{font-weight:700;font-size:16px;line-height:1.2;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt{display:flex;align-items:baseline;gap:6px;margin-top:6px}
.cnt b{font-size:30px;line-height:1;color:var(--good);font-variant-numeric:tabular-nums}
.cnt span{color:var(--mute);font-size:13px}
.sync{font-size:12px;color:var(--mute);margin-top:2px}
.sync.bad{color:var(--bad)} .sync.warn{color:var(--warn)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.good{background:var(--good);color:#fff;border-color:var(--good)}
.btn.big{padding:13px 18px;font-size:16px}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
.ib{border:0;background:none;font-size:20px;padding:6px 8px;border-radius:8px;color:var(--mute)}
.ib:hover{background:var(--soft)}
.prt{margin-left:auto}
.prt.on{border-color:var(--good);color:var(--good);background:var(--good-bg)}
.tools{padding:12px 0 6px}
.tools input[type=search]{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 14px;font-size:17px}
.chips{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;color:var(--mute)}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.novo{width:100%}
.list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.p{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;display:flex;gap:10px;align-items:center}
.p:hover{border-color:var(--accent)}
.p.done{background:var(--soft)}
.pm{flex:1;min-width:0}
.pn{font-weight:700;font-size:16px;line-height:1.2;overflow-wrap:anywhere}
.pe{color:var(--mute);font-size:13px;overflow-wrap:anywhere}
.pp{margin-top:4px;display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:12px;color:var(--mute)}
.pr{flex:none;text-align:right}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.mute{background:var(--mute-bg);color:var(--mute)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.empty{padding:28px 12px;text-align:center;color:var(--mute)}
.alert{padding:12px 14px;border-radius:10px;background:var(--bad-bg);color:var(--bad);margin:12px 0}
.ov{position:fixed;inset:0;background:rgba(10,18,26,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
@media(min-width:640px){.ov{align-items:center;padding:16px}}
.sheet{background:var(--surface);width:min(560px,100%);max-height:100%;overflow:auto;border-radius:16px 16px 0 0;padding:14px 14px 18px}
@media(min-width:640px){.sheet{border-radius:16px}}
.sh-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sh-h b{font-size:18px}
.prev{background:var(--mute-bg);border-radius:10px;padding:10px;display:flex;justify-content:center}
.prev canvas{max-width:100%;height:auto;background:#fff;border:1px solid var(--line);image-rendering:pixelated}
.qri{font-size:12px;color:var(--mute);margin:6px 2px 0;min-height:16px}
.qri.warn{color:var(--warn)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute);min-width:0}
.form .full{grid-column:1/-1}
.form input[type=text],.form input[type=search],.form input[type=number],.form input[type=tel],.form input[type=email],.form select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px;font-size:15px;width:100%;min-width:0;color:var(--ink)}
.form label.chk{flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
.form input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.xl{display:flex;gap:6px;align-items:center}
.xl input{flex:1}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.acts .big{flex:1}
.banner{padding:9px 12px;border-radius:10px;font-size:13px;margin-bottom:8px}
.banner.warn{background:var(--warn-bg);color:var(--warn)} .banner.bad{background:var(--bad-bg);color:var(--bad)} .banner.good{background:var(--good-bg);color:var(--good)}
.ifr{margin-top:8px;display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:13px;background:#fff7e0;border:1px solid #f0d58a;border-radius:10px;padding:6px 10px}
.ifr[hidden]{display:none}
.msg{margin-top:10px;font-size:14px;min-height:18px}
.msg.bad{color:var(--bad)} .msg.good{color:var(--good);font-weight:600}
.hint{font-size:12px;color:var(--mute);margin:6px 0 0}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#14222E;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:40;max-width:92%;display:none}
#pa{display:none}
@media print{
  body>*:not(#pa){display:none!important}
  #pa{display:block}
  #pa img{display:block;width:100%;image-rendering:pixelated}
  @page{margin:0}
}
</style></head><body>
<div id="root"></div>

<script>
(function(){
'use strict';
var EV_ID = '';
/* Endereço do script das inscrições (o mesmo da landing page): usado só para conferir se o CNPJ é de associado. */
var API_URL = 'https://script.google.com/macros/s/AKfycbyL_KMYvPhnnAlkGXoa3plqPkHgyncv89K2Wlfv1_LTk5IOHhFalUMRADp17sjpTOPU/exec';

/* ---------- utilidades ---------- */
function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function nz(s){return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function dig(s){return String(s==null?'':s).replace(/\D/g,'')}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
var mem={};
function lsGet(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return (k in mem)?mem[k]:d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){mem[k]=v}}
var CFGAPI={url:'',key:''};
function gs(fn){
  var a=[].slice.call(arguments,1);
  if(fn==='listEvents')fn='credEventos';
  return fetch(CFGAPI.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:a,key:CFGAPI.key}),redirect:'follow'})
   .then(function(x){return x.json()}).then(function(j){
     if(j&&j.auth===false){var e=new Error('Chave inválida');e.auth=true;throw e}
     if(!j||!j.ok)throw new Error((j&&j.erro)||'Erro no servidor');
     return fn==='credEventos'?(j.r||[]).map(function(e){return JSON.stringify(e)}):j.r});
}
function toast(t,ms){var e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display='none'},ms||2600)}
function hhmm(s){var m=/(\d{2}:\d{2})(:\d{2})?\s*$/.exec(String(s||''));return m?m[1]:''}
function hm(ms){try{return new Date(ms).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}catch(e){return ''}}
function agoraFmt(){var d=new Date(),p=function(n){return ('0'+n).slice(-2)};return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear()+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())}
function uuid(){return 't'+Math.random().toString(36).slice(2,10)+Date.now().toString(36)}

/* Nome na etiqueta: "LUCIANO ANDRE" e "Andre luiz araujo" viram "Luciano Andre" e "Andre Luiz Araujo" */
var PEQ={de:1,da:1,do:1,das:1,dos:1,e:1};
function tituloNome(s){
  s=String(s||'').replace(/\s+/g,' ').trim();
  if(!s)return s;
  var ws=s.split(' ');
  var tudoMai=(s===s.toUpperCase()&&/[A-ZÀ-Ú]/.test(s));
  var minus=ws.some(function(w,i){return !(i>0&&PEQ[w.toLowerCase()])&&w.charAt(0)!==w.charAt(0).toUpperCase()});
  if(!tudoMai&&!minus)return s;
  return ws.map(function(w,i){w=w.toLowerCase();return (i>0&&PEQ[w])?w:w.charAt(0).toUpperCase()+w.slice(1)}).join(' ');
}
function cnpjOk(c){
  if(!c||c.length!==14||/^(\d)\1+$/.test(c))return false;
  function dv(b){var w=b.length===12?[5,4,3,2,9,8,7,6,5,4,3,2]:[6,5,4,3,2,9,8,7,6,5,4,3,2],s=0;for(var i=0;i<w.length;i++)s+=Number(b.charAt(i))*w[i];var r=s%11;return r<2?0:11-r}
  var d1=dv(c.slice(0,12)),d2=dv(c.slice(0,12)+d1);return c.slice(12)===String(d1)+String(d2);
}
function foneE164(s){
  var d=dig(s);if(d.length<10)return '';
  if(d.length>=12&&d.slice(0,2)==='55')return '+'+d;
  if(d.length===10||d.length===11)return '+55'+d;
  return '+'+d;
}

/* ---------- configuração (fica guardada neste aparelho) ---------- */
var CFG=Object.assign({largura:384,altura:35,girar:'nao',pacote:100,atraso:25,avanco:4,operador:'',qrPadrao:true,qrEmpresa:true,qrEmail:true},lsGet('cred-cfg',{}));
function salvarCfg(){lsSet('cred-cfg',CFG)}

/* ---------- estado ---------- */
var S={ev:null,eventos:[],pessoas:[],f:'pend',q:'',sync:0,erro:'',offline:false,pend:lsGet('cred-pend',[]),syncing:false};
var printer={dev:null,chr:null,nome:''};

function pessoaPorId(id){for(var i=0;i<S.pessoas.length;i++)if(S.pessoas[i].id===id)return S.pessoas[i];return null}
function ehEspera(p){return nz(p.status)==='lista de espera'}
function salvarPend(){lsSet('cred-pend',S.pend)}

/* ---------- etiqueta: QR de contato (vCard) ---------- */
if(window.qrcode&&qrcode.stringToBytesFuncs&&qrcode.stringToBytesFuncs['UTF-8'])qrcode.stringToBytes=qrcode.stringToBytesFuncs['UTF-8'];
function vEsc(s){return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,' ')}
function montarVcard(nome,empresa,tel,email){
  var L=['BEGIN:VCARD','VERSION:3.0','FN:'+vEsc(nome)];
  if(empresa)L.push('ORG:'+vEsc(empresa));
  if(tel)L.push('TEL;TYPE=CELL:'+tel);
  if(email)L.push('EMAIL:'+email);
  L.push('END:VCARD');
  return L.join('\n');
}
/* Escolhe o menor QR que cabe no espaço, com módulos de pelo menos 3 pontos (leitura segura em papel térmico).
   Se não couber, tira a empresa e depois o e-mail do QR. */
function montarQR(d,maxPx){
  var tel=foneE164(d.fone),mail=String(d.email||'').trim();
  if(!tel&&!mail)return {vazio:true,motivo:'Sem telefone nem e-mail: não há contato para colocar no QR.'};
  var tent=[{emp:d.incEmpresa,mail:d.incEmail}];
  if(d.incEmpresa)tent.push({emp:false,mail:d.incEmail});
  if(d.incEmail||d.incEmpresa)tent.push({emp:false,mail:false});
  if(!tel&&!mail)tent=[];
  var qz=2,ultimo=null,aviso='';
  for(var i=0;i<tent.length;i++){
    var t=tent[i];
    var texto=montarVcard(d.nome,t.emp?d.empresa:'',tel,t.mail?mail:'');
    for(var e=0;e<2;e++){
      var ecc=e===0?'M':'L';
      var q=qrcode(0,ecc);q.addData(texto,'Byte');q.make();
      var n=q.getModuleCount();
      ultimo={q:q,n:n,ecc:ecc,texto:texto,emp:t.emp,mail:t.mail&&!!mail};
      if((n+2*qz)*3<=maxPx){
        var m=Math.min(5,Math.floor(maxPx/(n+2*qz)));
        if(i>0)aviso='Para o QR caber e ler bem, ficou sem '+(!t.emp&&d.incEmpresa&&d.empresa?'a empresa':'')+(!t.emp&&d.incEmpresa&&d.empresa&&!t.mail&&d.incEmail&&mail?' e ':'')+(!t.mail&&d.incEmail&&mail?'o e-mail':'')+'.';
        return {q:q,n:n,ecc:ecc,m:m,qz:qz,px:(n+2*qz)*m,texto:texto,emp:t.emp,mail:t.mail&&!!mail,aviso:aviso,tel:!!tel};
      }
    }
  }
  var m2=Math.max(1,Math.floor(maxPx/(ultimo.n+2*qz)));
  return {q:ultimo.q,n:ultimo.n,ecc:ultimo.ecc,m:m2,qz:qz,px:(ultimo.n+2*qz)*m2,texto:ultimo.texto,emp:ultimo.emp,mail:ultimo.mail,aviso:'QR pequeno demais para o papel: pode não ler. Aumente a altura/largura nos Ajustes ou desmarque empresa e e-mail.',tel:!!tel,pequeno:true};
}

/* ---------- etiqueta: desenho ---------- */
function dimensoes(){
  var comp=Math.round(CFG.altura*8),larg=Math.round(CFG.largura);
  return CFG.girar==='nao'?{W:larg,H:comp}:{W:comp,H:larg};     // tamanho do crachá como a pessoa vai ler
}
function quebrar(ctx,txt,maxW){
  var ws=String(txt).split(/\s+/).filter(Boolean),ls=[],cur='';
  ws.forEach(function(w){var t=cur?cur+' '+w:w;if(!cur||ctx.measureText(t).width<=maxW)cur=t;else{ls.push(cur);cur=w}});
  if(cur)ls.push(cur);
  return ls;
}
function ajustar(ctx,txt,maxW,maxH,tams,peso,maxLin){
  var i,sz,ls,lh;
  for(i=0;i<tams.length;i++){
    sz=tams[i];ctx.font=peso+' '+sz+'px Arial,Helvetica,sans-serif';
    ls=quebrar(ctx,txt,maxW);lh=Math.round(sz*1.14);
    if(ls.length<=maxLin&&ls.length*lh<=maxH&&ls.every(function(l){return ctx.measureText(l).width<=maxW}))return {sz:sz,ls:ls,lh:lh};
  }
  sz=tams[tams.length-1];ctx.font=peso+' '+sz+'px Arial,Helvetica,sans-serif';lh=Math.round(sz*1.14);
  ls=quebrar(ctx,txt,maxW).slice(0,Math.max(1,Math.min(maxLin,Math.floor(maxH/lh))));
  ls=ls.map(function(l){while(l.length>1&&ctx.measureText(l).width>maxW)l=l.slice(0,-1);return l});
  return {sz:sz,ls:ls,lh:lh};
}
function desenhar(canvas,d){
  var D=dimensoes(),W=D.W,H=D.H;
  canvas.width=W;canvas.height=H;
  var ctx=canvas.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
  ctx.textBaseline='top';ctx.fillStyle='#000';
  var pad=Math.max(8,Math.round(Math.min(W,H)*0.04));
  var qr=d.qr&&!d.qr.vazio?d.qr:null;
  var gap=12,capH=qr?16:0;
  var tx=pad,tw=W-2*pad-(qr?qr.px+gap:0),ty=pad,th=H-2*pad;
  var ex=(d.extras||[]).filter(function(x){return String(x).trim()});
  var exLh=26,exH=ex.length*(exLh+4);
  var corpoH=th-exH-(exH?6:0);
  var tamN=[],k;for(k=Math.min(60,Math.floor(corpoH*0.5));k>=22;k-=2)tamN.push(k);
  if(!tamN.length)tamN=[22];
  var N=ajustar(ctx,d.nome||' ',tw,d.empresa?corpoH*0.68:corpoH,tamN,'700',3);
  var nH=N.ls.length*N.lh;
  var tamE=[];for(k=Math.min(30,N.sz-4);k>=16;k-=2)tamE.push(k);
  if(!tamE.length)tamE=[16];
  var E=d.empresa?ajustar(ctx,d.empresa,tw,Math.max(20,corpoH-nH-8),tamE,'400',2):null;
  var eH=E?E.ls.length*E.lh+8:0;
  var y=ty+Math.max(0,Math.round((corpoH-nH-eH)/2));
  ctx.font='700 '+N.sz+'px Arial,Helvetica,sans-serif';
  N.ls.forEach(function(l){ctx.fillText(l,tx,y);y+=N.lh});
  if(E){
    y+=8;ctx.font='400 '+E.sz+'px Arial,Helvetica,sans-serif';
    E.ls.forEach(function(l){ctx.fillText(l,tx,y);y+=E.lh});
  }
  var yy=ty+th-exH;
  ex.forEach(function(x){
    ctx.fillStyle='#000';ctx.fillRect(tx,yy,tw,exLh);
    var t=String(x).toUpperCase(),sz=20;
    ctx.font='700 '+sz+'px Arial,Helvetica,sans-serif';
    while(sz>12&&ctx.measureText(t).width>tw-10){sz-=1;ctx.font='700 '+sz+'px Arial,Helvetica,sans-serif'}
    ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText(t,tx+tw/2,yy+Math.round((exLh-sz)/2)-1);
    ctx.textAlign='left';ctx.fillStyle='#000';yy+=exLh+4;
  });
  if(qr){
    var bx=W-pad-qr.px,by=Math.round((H-(qr.px+capH))/2);
    var qm=qr.m,qz=qr.qz;
    ctx.fillStyle='#fff';ctx.fillRect(bx,by,qr.px,qr.px);
    ctx.fillStyle='#000';
    for(var r=0;r<qr.n;r++)for(var c=0;c<qr.n;c++)if(qr.q.isDark(r,c))ctx.fillRect(bx+(c+qz)*qm,by+(r+qz)*qm,qm,qm);
    ctx.font='700 13px Arial,Helvetica,sans-serif';ctx.textAlign='center';
    ctx.fillText('SALVAR CONTATO',bx+qr.px/2,by+qr.px+2);
    ctx.textAlign='left';
  }
}
function maxQRpx(){var D=dimensoes();return Math.floor(Math.min(D.W*0.42,D.H-2*Math.max(8,Math.round(Math.min(D.W,D.H)*0.04))-16))}

/* ---------- impressão: ESC/POS por Bluetooth (BLE) ---------- */
function rasterizar(canvas){
  var c=canvas;
  if(CFG.girar!=='nao'){
    var r=document.createElement('canvas');r.width=c.height;r.height=c.width;
    var x=r.getContext('2d');
    if(CFG.girar==='90'){x.translate(r.width,0);x.rotate(Math.PI/2)}else{x.translate(0,r.height);x.rotate(-Math.PI/2)}
    x.drawImage(c,0,0);c=r;
  }
  var w=c.width,h=c.height,bw=Math.ceil(w/8);
  var px=c.getContext('2d').getImageData(0,0,w,h).data,out=new Uint8Array(bw*h);
  for(var y=0;y<h;y++)for(var xx=0;xx<w;xx++){
    var i=(y*w+xx)*4,lum=0.299*px[i]+0.587*px[i+1]+0.114*px[i+2];
    if(px[i+3]>0&&lum<150)out[y*bw+(xx>>3)]|=(0x80>>(xx&7));
  }
  return {bw:bw,h:h,data:out};
}
function comandos(rast,avanco){
  var partes=[Uint8Array.of(0x1B,0x40)],faixa=96,y,hh,tot=2;
  for(y=0;y<rast.h;y+=faixa){
    hh=Math.min(faixa,rast.h-y);
    partes.push(Uint8Array.of(0x1D,0x76,0x30,0x00,rast.bw&255,rast.bw>>8,hh&255,hh>>8));
    partes.push(rast.data.subarray(y*rast.bw,(y+hh)*rast.bw));
  }
  if(avanco>0)partes.push(Uint8Array.of(0x1B,0x64,Math.min(255,avanco)));
  partes.forEach(function(p,i){if(i>0)tot+=p.length});
  var all=new Uint8Array(tot+0),o=0;
  partes.forEach(function(p){all.set(p,o);o+=p.length});
  return all.subarray(0,o);
}
var BLE_SERVICOS=['000018f0-0000-1000-8000-00805f9b34fb','0000ff00-0000-1000-8000-00805f9b34fb','e7810a71-73ae-499d-8c15-faa9aef0c3f2','49535343-fe7d-4ae5-8fa9-9fafd205e455','0000ae30-0000-1000-8000-00805f9b34fb','0000ffe0-0000-1000-8000-00805f9b34fb','0000fee7-0000-1000-8000-00805f9b34fb'];
function erroBt(e){
  var m=String((e&&e.message)||e||''),n=(e&&e.name)||'';
  if(n==='NotFoundError'||/cancel/i.test(m))return 'Nenhuma impressora escolhida.';
  if(/permissions? policy|disallowed|not allowed|SecurityError/i.test(m+n))return 'O navegador bloqueou o Bluetooth nesta página. O Google bloqueia o Bluetooth direto nesta página. Toque em “Imprimir pelo navegador” e escolha a impressora na janela de impressão.';
  if(/GATT|disconnected|NetworkError/i.test(m+n))return 'A impressora desconectou. Ligue ela, chegue perto e tente de novo.';
  return m||'Não consegui falar com a impressora.';
}
async function abrirGatt(dev){
  var srv=await dev.gatt.connect(),servs=await srv.getPrimaryServices(),chr=null,i,j,cs;
  for(i=0;i<servs.length&&!chr;i++){
    cs=await servs[i].getCharacteristics();
    for(j=0;j<cs.length;j++)if(cs[j].properties.writeWithoutResponse||cs[j].properties.write){chr=cs[j];break}
  }
  if(!chr)throw new Error('Não achei por onde enviar para essa impressora. Escolha a impressora térmica na lista.');
  printer.dev=dev;printer.chr=chr;printer.nome=dev.name||'impressora';
  dev.removeEventListener('gattserverdisconnected',desconectou);dev.addEventListener('gattserverdisconnected',desconectou);
  atualizarTopo();
}
function desconectou(){printer.chr=null;atualizarTopo()}
async function garantirImpressora(){
  if(!navigator.bluetooth)throw new Error('Este navegador não tem Bluetooth. Abra no Chrome do Android.');
  if(printer.dev&&printer.dev.gatt.connected&&printer.chr)return;
  if(printer.dev){try{await abrirGatt(printer.dev);return}catch(e){}}
  var dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:BLE_SERVICOS});
  await abrirGatt(dev);
}
async function enviarBytes(bytes){
  var tam=Math.max(20,CFG.pacote|0),i=0,chunk;
  while(i<bytes.length){
    chunk=bytes.slice(i,i+tam);
    try{
      if(printer.chr.properties.writeWithoutResponse)await printer.chr.writeValueWithoutResponse(chunk);else await printer.chr.writeValue(chunk);
      i+=tam;
    }catch(e){if(tam>20){tam=20;continue}throw e}
    await sleep(CFG.atraso|0);
  }
}

  W.busy=true;$('#wOk').disabled=true;m.textContent='Cadastrando…';m.className='msg';
  try{
    var r=await gs('credCadastrarNaHora',S.ev.regSheet,S.ev.regTab||'',d);
    if(!(r&&r.ok)){throw new Error((r&&r.erro)||'Não consegui cadastrar.')}
    var p=r.pessoa,ex=pessoaPorId(p.id);
    if(!ex)S.pessoas.push(p);else p=ex;
    if(r.duplicado)toast('Essa pessoa já estava na lista. Abri a etiqueta dela.',3500);
    W=null;renderTudo();abrirEtiqueta(p);
  }catch(e){
    W.busy=false;$('#wOk').disabled=false;m.textContent=String((e&&e.message)||e);m.className='msg bad';
  }
}

/* ---------- modal: ajustes ---------- */
function abrirAjustes(){
  $('#modal').innerHTML=
   '<div class="ov"><div class="sheet" role="dialog" aria-modal="true">'+
   '<div class="sh-h"><b>Ajustes da etiqueta</b><button class="ib" id="aX" aria-label="Fechar">✕</button></div>'+
   '<div class="form">'+
   '<label>Largura impressa (pontos)<select id="aL"><option value="384">384 (papel 58 mm)</option><option value="576">576 (papel 80 mm)</option><option value="320">320</option></select></label>'+
   '<label>Altura da etiqueta (mm)<input type="number" id="aA" min="15" max="200" step="1" value="'+esc(CFG.altura)+'"></label>'+
   '<label>Girar a imagem<select id="aG"><option value="nao">Não</option><option value="90">90° (deitada)</option><option value="270">270° (deitada, outro lado)</option></select></label>'+
   '<label>Avanço do papel (linhas)<input type="number" id="aV" min="0" max="30" value="'+esc(CFG.avanco)+'"></label>'+
   '<label>Bytes por envio (Bluetooth)<input type="number" id="aP" min="20" max="512" value="'+esc(CFG.pacote)+'"></label>'+
   '<label>Pausa entre envios (ms)<input type="number" id="aD" min="0" max="200" value="'+esc(CFG.atraso)+'"></label>'+
   '<label class="full">Quem está credenciando (vai para o histórico)<input type="text" id="aO" value="'+esc(CFG.operador)+'"></label>'+
   '<label class="chk full"><input type="checkbox" id="aQ"'+(CFG.qrPadrao?' checked':'')+'> Etiqueta nova já vem com QR de contato</label>'+
   '<label class="chk"><input type="checkbox" id="aE"'+(CFG.qrEmpresa?' checked':'')+'> Empresa no QR</label>'+
   '<label class="chk"><input type="checkbox" id="aM"'+(CFG.qrEmail?' checked':'')+'> E-mail no QR</label>'+
   '</div><p class="hint">Estes ajustes ficam guardados só neste aparelho. Meça a etiqueta uma vez e imprima o teste.</p>'+
   '<div class="acts"><button class="btn" id="aTeste">Imprimir teste</button><button class="btn pri big" id="aOk">Salvar</button></div></div></div>';
  $('#aL').value=String(CFG.largura);$('#aG').value=CFG.girar;
}
function lerAjustes(){
  CFG.largura=+$('#aL').value||384;CFG.altura=Math.max(15,+$('#aA').value||35);CFG.girar=$('#aG').value;
  CFG.avanco=Math.max(0,+$('#aV').value||0);CFG.pacote=Math.max(20,+$('#aP').value||100);CFG.atraso=Math.max(0,+$('#aD').value||0);
  CFG.operador=$('#aO').value.trim();CFG.qrPadrao=$('#aQ').checked;CFG.qrEmpresa=$('#aE').checked;CFG.qrEmail=$('#aM').checked;
  salvarCfg();
}

/* ---------- eventos ---------- */
document.addEventListener('click',function(ev){
  var t=ev.target,b;
  if((b=t.closest('[data-ev]'))){escolherEvento(b.getAttribute('data-ev'));return}
  if((b=t.closest('.p[data-id]'))){var p=pessoaPorId(b.getAttribute('data-id'));if(p)abrirEtiqueta(p);return}
  if((b=t.closest('.chip'))){S.f=b.getAttribute('data-f');renderChips();renderLista();return}
  var id=t.id||(t.closest('button')&&t.closest('button').id)||'';
  if(t.closest('[data-rmex]')){lerCamposEtiqueta();M.extras.splice(+t.closest('[data-rmex]').getAttribute('data-rmex'),1);var s=M;renderEtiqueta();return}
  switch(id){
    case 'bNovo':abrirNovo();break;
    case 'bAj':abrirAjustes();break;
    case 'bPr':conectarManual();break;
    case 'mX':case 'wX':case 'wCancel':case 'aX':fecharModal();break;
    case 'bEx':lerCamposEtiqueta();M.extras.push('');renderEtiqueta();break;
    case 'bImp':acaoImprimir('bt');break;
    case 'bOutras':$('#alt').hidden=!$('#alt').hidden;break;
    case 'bNav':acaoImprimir('nav');break;
    case 'bImg':acaoImprimir('img');break;
    case 'wOk':enviarNovo();break;
    case 'aOk':lerAjustes();fecharModal();toast('Ajustes salvos');break;
    case 'aTeste':lerAjustes();abrirTeste();break;
  }
});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.id==='q'){S.q=t.value;renderLista();return}
  if(M&&(t.id==='mNome'||t.id==='mEmp'||t.id==='mFone'||t.id==='mMail'||t.hasAttribute('data-ex'))){lerCamposEtiqueta();redesenhar();return}
  if(t.id==='wCnpj')consultarCnpj();
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(M&&(t.id==='mQr'||t.id==='mIE'||t.id==='mIM')){lerCamposEtiqueta();redesenhar()}
});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&$('#modal').innerHTML)fecharModal()});
async function conectarManual(){
  try{
    if(printer.dev&&printer.chr){toast('Impressora conectada: '+printer.nome);return}
    await garantirImpressora();toast('Conectada: '+printer.nome);
  }catch(e){toast(erroBt(e),4500)}
}
async function escolherEvento(id){
  var e=S.eventos.filter(function(x){return x.id===id})[0];
  if(!e)return;
  lsSet('cred-ev',id);
  iniciarEvento(e);
}
function iniciarEvento(e){
  S.ev=e;
  if(!e.regSheet){
    $('#root').innerHTML='<div class="wrap"><div class="alert">O evento “'+esc(e.name)+'” ainda não tem a planilha de inscritos. Abra a Central, aba Inscrições, e cole o link da planilha.</div></div>';
    return;
  }
  montarEsqueleto();renderTudo();sincronizar(true);
}
setInterval(function(){if(S.ev&&document.visibilityState==='visible'&&!(M&&M.ocupado))sincronizar(false)},15000);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&S.ev)sincronizar(false)});

function telaConfig(erro){
  $('#root').innerHTML='<div class="wrap"><div class="card" style="margin-top:24px"><h2 style="margin:0 0 6px">Conectar à Central</h2>'+
   '<p style="color:var(--mut);font-size:14px;margin:0 0 12px">Cole o link do app da Central (termina em /exec) e a chave definida em CRED_KEY.</p>'+
   (erro?'<div class="msg bad">'+esc(erro)+'</div>':'')+
   '<label>Link da Central</label><input id="cfgUrl" value="'+esc(CFGAPI.url)+'" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off">'+
   '<label>Chave</label><input id="cfgKey" type="password" value="'+esc(CFGAPI.key)+'" autocomplete="off">'+
   '<div class="acts"><button class="btn pri big" id="cfgOk">Conectar</button></div></div></div>';
  $('#cfgOk').onclick=function(){
    CFGAPI.url=$('#cfgUrl').value.trim();CFGAPI.key=$('#cfgKey').value.trim();
    if(!/^https:\/\/script\.google\.com\//.test(CFGAPI.url)||!CFGAPI.key){telaConfig('Preencha o link da Central e a chave.');return}
    lsSet('cred-api',CFGAPI);boot();
  };
}
async function boot(){
  $('#root').innerHTML='<div class="empty">Carregando…</div>';
  try{await carregarEventos()}catch(e){telaConfig(e&&e.auth?'Chave inválida.':'Não consegui falar com a Central: '+((e&&e.message)||e));return}
  var alvo=S.eventos.filter(function(e){return e.id===EV_ID})[0]||S.eventos.filter(function(e){return e.id===lsGet('cred-ev','')})[0];
  if(alvo)iniciarEvento(alvo);else renderEscolha();
}
(function(){
  var q=new URLSearchParams(location.search),sv=lsGet('cred-api',{});
  CFGAPI.url=q.get('api')||sv.url||'';CFGAPI.key=q.get('k')||sv.key||'';EV_ID=q.get('ev')||'';
  if(q.get('api')||q.get('k')){lsSet('cred-api',CFGAPI);try{history.replaceState(null,'',location.pathname+(EV_ID?'?ev='+encodeURIComponent(EV_ID):''))}catch(e){}}
  if(!CFGAPI.url||!CFGAPI.key)telaConfig('');else boot();
})();
})();
</script>
</body></html>
